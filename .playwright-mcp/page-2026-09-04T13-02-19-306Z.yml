    - generic [ref=e240]:
      - generic [ref=e242]:
        - generic [ref=e243]: Why Educraft
        - heading "A different kind of education company." [level=2] [ref=e244]
        - paragraph [ref=e245]: Most education offerings are collections of courses. Educraft is a connected system — five specialist verticals sharing one philosophy, one standard of evidence, and one view of the learner.
      - generic [ref=e246]:
        - generic [ref=e247]:
          - generic [ref=e248]: "01"
          - generic [ref=e249]:
            - heading "One ecosystem, not five silos" [level=3] [ref=e250]
            - paragraph [ref=e251]: Programmes are designed to work together. A student building language confidence can also access wellbeing support; an exam aspirant can pause for counselling without leaving the system. Learners move between paths without starting over.
        - generic [ref=e252]:
          - generic [ref=e253]: "02"
          - generic [ref=e254]:
            - heading "Specialists in every room" [level=3] [ref=e255]
            - paragraph [ref=e256]: Each vertical is led by people trained for it — language specialists, certified special educators, licensed counsellors, technologists, and exam mentors. Nobody is improvising outside their field.
        - generic [ref=e257]:
          - generic [ref=e258]: "03"
          - generic [ref=e259]:
            - heading "Families are partners, not spectators" [level=3] [ref=e260]
            - paragraph [ref=e261]: Goals are agreed with families, not announced to them. Structured check-ins, plain-language reports, and home strategies keep parents genuinely part of the journey.
        - generic [ref=e262]:
          - generic [ref=e263]: "04"
          - generic [ref=e264]:
            - heading "Progress you can actually see" [level=3] [ref=e265]
            - paragraph [ref=e266]: "Portfolios, dashboards, and benchmarked checkpoints replace vague reassurance. Every programme answers the same question with evidence: what can the student do now that they could not do before?"
        - generic [ref=e267]:
          - generic [ref=e268]: "05"
          - generic [ref=e269]:
            - heading "Wellbeing woven in, not bolted on" [level=3] [ref=e270]
            - paragraph [ref=e271]: Steadiness is designed into every programme — realistic targets, study-rest cycles, and access to counselling. We treat sustainable learning as a performance advantage, not a soft option.
