        - generic [ref=f1e242]:
          - generic [ref=f1e243]: Why Educraft
          - heading "A different kind of education company." [level=2] [ref=f1e244]
          - paragraph [ref=f1e245]: Most education offerings are collections of courses. Educraft is a connected system — five specialist verticals sharing one philosophy, one standard of evidence, and one view of the learner.
        - generic [ref=f1e246]:
          - generic [ref=f1e247]:
            - generic [ref=f1e248]: "01"
            - generic [ref=f1e249]:
              - heading "One ecosystem, not five silos" [level=3] [ref=f1e250]
              - paragraph [ref=f1e251]: Programmes are designed to work together. A student building language confidence can also access wellbeing support; an exam aspirant can pause for counselling without leaving the system. Learners move between paths without starting over.
          - generic [ref=f1e252]:
            - generic [ref=f1e253]: "02"
            - generic [ref=f1e254]:
              - heading "Specialists in every room" [level=3] [ref=f1e255]
              - paragraph [ref=f1e256]: Each vertical is led by people trained for it — language specialists, certified special educators, licensed counsellors, technologists, and exam mentors. Nobody is improvising outside their field.
          - generic [ref=f1e257]:
            - generic [ref=f1e258]: "03"
            - generic [ref=f1e259]:
              - heading "Families are partners, not spectators" [level=3] [ref=f1e260]
              - paragraph [ref=f1e261]: Goals are agreed with families, not announced to them. Structured check-ins, plain-language reports, and home strategies keep parents genuinely part of the journey.
          - generic [ref=f1e262]:
            - generic [ref=f1e263]: "04"
            - generic [ref=f1e264]:
              - heading "Progress you can actually see" [level=3] [ref=f1e265]
              - paragraph [ref=f1e266]: "Portfolios, dashboards, and benchmarked checkpoints replace vague reassurance. Every programme answers the same question with evidence: what can the student do now that they could not do before?"
          - generic [ref=f1e267]:
            - generic [ref=f1e268]: "05"
            - generic [ref=f1e269]:
              - heading "Wellbeing woven in, not bolted on" [level=3] [ref=f1e270]
              - paragraph [ref=f1e271]: Steadiness is designed into every programme — realistic targets, study-rest cycles, and access to counselling. We treat sustainable learning as a performance advantage, not a soft option.
