          - generic [ref=e244]: Why Educraft
          - heading "A different kind of education company." [level=2] [ref=e245]
          - paragraph [ref=e246]: Most education offerings are collections of courses. Educraft is a connected system — five specialist verticals sharing one philosophy, one standard of evidence, and one view of the learner.
        - generic [ref=e247]:
          - generic [ref=e248]:
            - generic [ref=e249]: "01"
            - generic [ref=e250]:
              - heading "One ecosystem, not five silos" [level=3] [ref=e251]
              - paragraph [ref=e252]: Programmes are designed to work together. A student building language confidence can also access wellbeing support; an exam aspirant can pause for counselling without leaving the system. Learners move between paths without starting over.
          - generic [ref=e253]:
            - generic [ref=e254]: "02"
            - generic [ref=e255]:
              - heading "Specialists in every room" [level=3] [ref=e256]
              - paragraph [ref=e257]: Each vertical is led by people trained for it — language specialists, certified special educators, licensed counsellors, technologists, and exam mentors. Nobody is improvising outside their field.
          - generic [ref=e258]:
            - generic [ref=e259]: "03"
            - generic [ref=e260]:
              - heading "Families are partners, not spectators" [level=3] [ref=e261]
              - paragraph [ref=e262]: Goals are agreed with families, not announced to them. Structured check-ins, plain-language reports, and home strategies keep parents genuinely part of the journey.
          - generic [ref=e263]:
            - generic [ref=e264]: "04"
            - generic [ref=e265]:
              - heading "Progress you can actually see" [level=3] [ref=e266]
              - paragraph [ref=e267]: "Portfolios, dashboards, and benchmarked checkpoints replace vague reassurance. Every programme answers the same question with evidence: what can the student do now that they could not do before?"
          - generic [ref=e268]:
            - generic [ref=e269]: "05"
            - generic [ref=e270]:
              - heading "Wellbeing woven in, not bolted on" [level=3] [ref=e271]
              - paragraph [ref=e272]: Steadiness is designed into every programme — realistic targets, study-rest cycles, and access to counselling. We treat sustainable learning as a performance advantage, not a soft option.
